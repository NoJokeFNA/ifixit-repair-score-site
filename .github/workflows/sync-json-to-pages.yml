name: Build JSON to gh-pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Checkout master (code)
        uses: actions/checkout@v7
        with:
          ref: master
          path: master

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install deps
        working-directory: master
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build JSON files into gh-pages
        env:
          IFIXIT_TOKEN: ${{ secrets.IFIXIT_TOKEN }}
        run: |
          python master/src/fetch_device_data.py --scores-output gh-pages/devices_with_scores.json --generate-rubric --rubric-output gh-pages/rubric.json --french-scores-output gh-pages/france_devices_with_scores.json --quality-report /tmp/data-quality-report.json

      - name: Summarize import quality
        if: always()
        run: python master/src/data_quality.py --summarize /tmp/data-quality-report.json

      - name: Retain import quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: import-quality-report
          path: /tmp/data-quality-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check rubric and device data before publishing
        working-directory: gh-pages
        run: |
          npm install --prefix /tmp/browser-tools playwright@1.65.0
          /tmp/browser-tools/node_modules/.bin/playwright install --with-deps chromium
          export NODE_PATH=/tmp/browser-tools/node_modules
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/rubric.cjs
          node tests/data.cjs
          node tests/france.cjs

      - name: Commit to gh-pages if changed
        working-directory: gh-pages
        run: |
          set -e
          # List of files to check
          files=("devices_with_scores.json" "rubric.json" "france_devices_with_scores.json")
          
          # Stage all files
          git add "${files[@]}" || { echo "Error staging files"; exit 1; }
          
          # Check for changes and collect modified files
          modified_files=()
          for file in "${files[@]}"; do
            if ! git diff --cached --quiet -- "$file" 2>/dev/null; then
              modified_files+=("$file")
            fi
          done
          
          # Commit and push if there are changes
          if [ ${#modified_files[@]} -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
            # Construct commit message dynamically
            if [ ${#modified_files[@]} -eq 1 ]; then
              commit_msg="chore(gh-pages): update ${modified_files[0]} $ts"
            else
              # Join file names with commas for readability
              commit_msg="chore(gh-pages): update $(IFS=', '; echo "${modified_files[*]}") $ts"
            fi
          
            git commit -m "$commit_msg" || { echo "Commit failed"; exit 1; }
            git push || { echo "Push failed"; exit 1; }
          else
            echo "No changes to commit."
          fi
