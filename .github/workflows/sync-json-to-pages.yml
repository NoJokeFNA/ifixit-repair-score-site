name: Build JSON to gh-pages

on:
  workflow_dispatch:
    inputs:
      api_rate:
        description: Maximum iFixit API requests per second (automatically reduced on HTTP 429)
        type: number
        default: 128
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC

permissions:
  contents: write
  pages: write

concurrency:
  group: repair-data-import
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Checkout master (code)
        uses: actions/checkout@v7
        with:
          ref: master
          path: master

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install deps
        working-directory: master
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build JSON files into gh-pages
        env:
          IFIXIT_TOKEN: ${{ secrets.IFIXIT_TOKEN }}
          IFIXIT_API_RATE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.api_rate) || '128' }}
        run: |
          python master/src/fetch_device_data.py --api-rate "$IFIXIT_API_RATE" --scores-output gh-pages/devices_with_scores.json --generate-rubric --rubric-output gh-pages/rubric.json --french-scores-output gh-pages/france_devices_with_scores.json --french-method-output gh-pages/french-method.json --images-output gh-pages/images.json --status-output gh-pages/data-status.json --quality-report /tmp/data-quality-report.json

      - name: Summarize import quality
        if: always()
        run: python master/src/data_quality.py --summarize /tmp/data-quality-report.json

      - name: Retain import quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: import-quality-report
          path: /tmp/data-quality-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check rubric and device data before publishing
        working-directory: gh-pages
        run: |
          npm install --prefix /tmp/browser-tools playwright@1.65.0
          export NODE_PATH=/tmp/browser-tools/node_modules
          export CHROMIUM_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROMIUM_PATH" ]; then
            /tmp/browser-tools/node_modules/.bin/playwright install --with-deps chromium
            export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          "$CHROMIUM_PATH" --version
          node tests/rubric.cjs
          node tests/data.cjs
          node tests/france.cjs

      - name: Commit to gh-pages if changed
        id: publish
        working-directory: gh-pages
        run: |
          set -euo pipefail
          files=("devices_with_scores.json" "rubric.json" "france_devices_with_scores.json" "french-method.json" "images.json" "data-status.json")

          comparable_json() {
            jq --sort-keys --arg key "$1" 'del(.[$key])' "${@:2}"
          }

          # Keep the published method and its date until the method itself changes.
          if git cat-file -e HEAD:french-method.json 2>/dev/null; then
            previous_method=$(git show HEAD:french-method.json | comparable_json checked_on)
            new_method=$(comparable_json checked_on french-method.json)
            if [[ "$previous_method" == "$new_method" ]]; then
              git restore -- french-method.json
            fi
          fi

          git add -- "${files[@]}" assets/devices

          # Keep the status timestamp until any published data or asset changes.
          if git diff --cached --quiet -- . ':(exclude)data-status.json' &&
             git cat-file -e HEAD:data-status.json 2>/dev/null; then
            previous_status=$(git show HEAD:data-status.json | comparable_json updated_at)
            new_status=$(comparable_json updated_at data-status.json)
            if [[ "$previous_status" == "$new_status" ]]; then
              git restore --source=HEAD --staged --worktree -- data-status.json
              echo "No changes to publish."
              exit 0
            fi
          fi

          modified_files=()
          for file in "${files[@]}"; do
            if ! git diff --cached --quiet -- "$file"; then
              modified_files+=("$file")
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ ${#modified_files[@]} -eq 1 ]; then
            commit_msg="chore(gh-pages): update ${modified_files[0]} $ts"
          else
            commit_msg="chore(gh-pages): refresh verified data, criteria and images $ts"
          fi
          git commit -m "$commit_msg"
          git push
          echo 'published=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-sync
    if: needs.build-and-sync.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN pushes do not trigger another workflow or a Pages build.
      # The repository publishes the gh-pages branch (legacy Pages mode).
      - name: Request the configured GitHub Pages branch build
        uses: actions/github-script@v9
        with:
          script: |
            const result = await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info(`Pages branch build requested: ${result.data.status}`);
