name: Browser regression checks
on:
  push:
    branches: [gh-pages]
    paths: ['*.html', '*.css', '*.js', '*.json', 'css/**', 'scripts/**', 'assets/**', 'design-preview/**', 'tests/**', '.github/workflows/browser.yml']
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser tools
        run: |
          npm ci
          npm run check:assets
          npm install --prefix /tmp/browser-tools playwright@1.65.0
          /tmp/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check dashboard and all rubric versions
        env:
          NODE_PATH: /tmp/browser-tools/node_modules
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/browser.cjs
          node tests/rubric.cjs
          node tests/responsive.cjs
          node tests/data.cjs
          node tests/france.cjs
          node tests/design-preview.cjs
